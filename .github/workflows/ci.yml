name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chọn commit gốc để so
        # PR → gốc của PR · push vào main → commit main trước đó · push nhánh khác → điểm tách khỏi main
        # (so với commit trước trên cùng nhánh là sai: bản nháp trong PR được phép viết lại so với nhau,
        #  chỉ không được viết lại những gì đã vào main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git merge-base HEAD origin/main)"
          fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "So với: $BASE"
      - run: python -m unittest discover -s tests -v
      - run: python -m minhtri.cli verify
      - name: Sổ chỉ ghi thêm (so với commit gốc)
        run: python tools/check_append_only.py "$BASE"
      - name: Luật Kiến trúc Tối cao (khoá băm + Chương V)
        run: python tools/check_law.py "$BASE"
      - name: Sổ bàn giao (Điều 12, 14) — PR
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python tools/check_handover.py "$BASE"
      - name: Sổ bàn giao (Điều 12, 14) — push vào main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EVENT: push
        run: python tools/check_handover.py "$BASE"
