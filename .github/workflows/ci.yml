name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m minhtri.cli verify
      - name: Sổ chỉ ghi thêm (so với commit gốc)
        run: python tools/check_append_only.py "${{ github.event.pull_request.base.sha || github.event.before }}"
