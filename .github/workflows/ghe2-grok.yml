name: ghe2-grok
# Ghế 2 tự động: gửi mô tả PR + diff cho Grok, đăng "KẾT QUẢ PHẢN BIỆN" lên PR.
# Chỉ đăng comment — không merge, không đổi mã (Điều 2). Xem docs/reviews/GHE2_TU_DONG.md.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Số PR cần phản biện"
        required: true

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: ghe2-grok-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Bỏ qua PR do bot/Action tạo hoặc có nhãn skip-ghe2 (workflow_dispatch: script tự kiểm).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.type != 'Bot' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ghe2'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Grok phản biện
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
        run: python -m minhtri.tools.ghe2_grok
